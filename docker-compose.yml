# Local end-to-end test: PostgreSQL -> backend (Flask) -> frontend (nginx) on http://localhost:8080.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: school_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-school-demo-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs the schema/seed SQL on first start, when the data volume is empty.
      - ./application/backend/init.sql:/docker-entrypoint-initdb.d/10-school-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    # The Jenkins pipeline rewrites this image name to the ECR image it just pushed.
    image: 513263709619.dkr.ecr.us-east-1.amazonaws.com/school-demo-backend:2
    build:
      context: ./application/backend
    environment:
      DATABASE_URL: postgresql://school_app:${POSTGRES_PASSWORD:-school-demo-local-only}@postgres:5432/school
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    # The Jenkins pipeline rewrites this image name to the ECR image it just pushed.
    image: 513263709619.dkr.ecr.us-east-1.amazonaws.com/school-demo-frontend:4
    build:
      context: ./application/frontend
    ports:
      # FRONTEND_PORT lets CI use another port, because Jenkins itself listens on 8080.
      - "${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
