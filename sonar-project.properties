# SonarQube (SAST) settings, read by the sonar-scanner that the Jenkins pipeline runs.
# The server URL and token are passed in by the pipeline, not stored here.
sonar.projectKey=school-demo
sonar.projectName=School demo
sonar.sourceEncoding=UTF-8

# Python backend and static JavaScript frontend. Tests are listed separately so they are not analysed as production code.
sonar.sources=application/backend/app.py,application/frontend/app.js,application/frontend/index.html
sonar.tests=application/backend/tests,application/frontend/tests,tests
sonar.exclusions=**/node_modules/**,**/.venv/**,**/reports/**

# Coverage written by pytest-cov in the "Unit tests" stage.
sonar.python.version=3.12
sonar.python.coverage.reportPaths=reports/coverage.xml
