# Teaching example of in-cluster RBAC: a read-only identity for this namespace.
# Identity (ServiceAccount) -> permissions (Role) -> link between them (RoleBinding).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: school-observer
  namespace: school-demo-v2
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: school-observer
  namespace: school-demo-v2
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
# Grants the Role above to the school-observer ServiceAccount.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: school-observer
  namespace: school-demo-v2
subjects:
  - kind: ServiceAccount
    name: school-observer
    namespace: school-demo-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: school-observer
