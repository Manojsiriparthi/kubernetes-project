apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3-v1
provisioner: ebs.csi.aws.com
# Delete removes the EBS volume with the PVC so a full destroy leaves nothing behind.
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
