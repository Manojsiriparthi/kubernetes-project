# Runs once, only when the data directory is empty (first start of postgres-0).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: school-demo-v1
data:
  10-school-schema.sql: |
    CREATE SEQUENCE hall_ticket_seq START WITH 2001;

    CREATE TABLE students (
        id BIGSERIAL PRIMARY KEY,
        first_name VARCHAR(80) NOT NULL,
        last_name VARCHAR(80) NOT NULL,
        class_name VARCHAR(32) NOT NULL,
        address VARCHAR(300) NOT NULL,
        phone VARCHAR(32) NOT NULL,
        father_phone VARCHAR(32) NOT NULL,
        hall_ticket VARCHAR(32) NOT NULL UNIQUE,
        recent_exam VARCHAR(120) NOT NULL,
        marks JSONB NOT NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    INSERT INTO students
