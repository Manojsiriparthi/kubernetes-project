# Internal Service for the frontend pods; the public ALB (see ingress.yaml) sends traffic straight to the pods.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: school-demo
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Nginx serving the web page and proxying /api/ to the backend: 3 replicas spread across availability zones.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: school-demo
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      # Run on application nodes; the toleration lets pods past that group's taint.
      nodeSelector:
        workload: application
      tolerations:
        - key: workload
          operator: Equal
          value: application
          effect: NoSchedule
      topologySpreadConstraints:
        # Hard AZ spread with maxSkew 1 allows a 4th pod (2/1/1) instead of leaving it Pending.
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: frontend
          matchLabelKeys: [pod-template-hash]
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: 513263709619.dkr.ecr.us-east-1.amazonaws.com/school-demo-frontend:version2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          # Keep serving for a few seconds after the pod is told to stop, while the ALB drains it.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
      terminationGracePeriodSeconds: 30
