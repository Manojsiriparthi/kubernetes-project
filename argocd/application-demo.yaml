# Argo CD demo: ONE application, ONE namespace, ONE public ALB. Version 1 -> version 2 -> rollback, with no downtime.
# Use this file INSTEAD of argocd/application.yaml (same Application name).
#
#   Start (version 1):    kubectl apply -f argocd/application-demo.yaml
#   Deploy version 2:     kubectl patch application school-demo -n argocd --type merge \
#                           -p '{"spec":{"source":{"targetRevision":"release/version2"}}}'
#   Roll back to v1:      kubectl patch application school-demo -n argocd --type merge \
#                           -p '{"spec":{"source":{"targetRevision":"release/version1"}}}'
#
# Both branches use the same namespace, StorageClass and ALB; only the image tag (version1 / version2) and the web page
# differ. Argo CD therefore changes the Deployments in place with a rolling update: new pods start and must pass the
# readiness probe and the ALB health check before old pods are removed (maxUnavailable 0), so the same URL keeps
# answering throughout. The database and its data are untouched.
#
# Before the demo, push the images once per branch: ./scripts/push-version-images.sh version1 (on release/version1)
# and ./scripts/push-version-images.sh version2 (on release/version2).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: school-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Manojsiriparthi/kubernetes-project
    # The branch Argo CD deploys. Changing this value is the "deploy version 2" and the "rollback".
    targetRevision: release/version1
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: school-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
