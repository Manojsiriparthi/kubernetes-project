# Argo CD Application for VERSION 2 (green): deploys release/version2 into namespace school-demo-v2.
# Apply with: kubectl apply -f argocd/application-v2.yaml
# Runs next to version 1 with its own namespace, images (tag "version2"), StorageClass and public ALB.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: school-demo-v2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Manojsiriparthi/kubernetes-project
    targetRevision: release/version2
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: school-demo-v2
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
