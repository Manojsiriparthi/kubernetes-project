# Argo CD Application: the CD half of the plan.
# Jenkins (CI) opens a pull request that changes the image names in kubernetes/*.yaml.
# When that pull request is merged into main, Argo CD notices the change and deploys it automatically.
# Apply this file once, after Argo CD is running:  kubectl apply -f argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: school-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Manojsiriparthi/kubernetes-project
    # Argo CD watches this branch; it is also the branch Jenkins raises its pull requests against.
    targetRevision: main
    # Every manifest in this folder is deployed.
    path: kubernetes
  destination:
    # The cluster Argo CD itself runs in.
    server: https://kubernetes.default.svc
    namespace: school-demo
  syncPolicy:
    automated:
      # Delete resources that were removed from git.
      prune: true
      # Undo manual changes made directly in the cluster.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
