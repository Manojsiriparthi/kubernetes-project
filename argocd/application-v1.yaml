# Argo CD Application for VERSION 1 (blue): deploys release/version1 into namespace school-demo-v1.
# Apply with: kubectl apply -f argocd/application-v1.yaml
# Its images are tagged "version1" and its StorageClass, namespace and ALB are separate from version 2,
# so both versions can run at the same time (see application-v2.yaml).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: school-demo-v1
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Manojsiriparthi/kubernetes-project
    # The branch Argo CD watches. Rollback = point this back to an older branch or use Argo CD History > Rollback.
    targetRevision: release/version1
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: school-demo-v1
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
